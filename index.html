<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>語文靈感 × 結構解密 (獨立前端版)</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --primary: #4a90e2; --secondary: #50e3c2; --bg: #f4f7f6; --card-bg: #ffffff; }
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; background: var(--bg); color: #333; }
    header { background: var(--primary); color: white; padding: 12px 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    .container { padding: 15px; max-width: 1100px; margin: 0 auto; }
    
    .btn { padding: 10px 18px; border: none; border-radius: 6px; background: var(--primary); color: white; font-size: 1rem; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: #6c757d; }
    .btn-success { background: #28a745; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: 1.1fr 0.9fr; } }
    
    .card { background: var(--card-bg); border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h3 { margin-top: 0; color: var(--primary); border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; }

    .video-box { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; min-height: 240px; }
    video { width: 100%; height: auto; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .vocab-tag { display: inline-block; background: #e1f5fe; color: #0288d1; padding: 6px 12px; border-radius: 15px; margin: 4px; font-size: 0.95rem; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>語文靈感 × 結構解密：寫作互動教具</header>

<div class="container">
  <!-- 角色選擇 -->
  <div id="setup-panel" class="card">
    <h3>請選擇當前裝置角色</h3>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn" onclick="initDisplayMode()">🖥️ 電腦 / 大螢幕 (呈現端)</button>
      <button class="btn btn-secondary" onclick="initMobileMode()">📱 手機 / 平板 (感應端 / 拍攝)</button>
    </div>
  </div>

  <!-- ==================== 呈現端 (Display) ==================== -->
  <div id="display-panel" class="hidden">
    <div class="grid grid-2">
      <div class="card">
        <h3>① 文本結構剖析 (手機鏡頭實時畫面)</h3>
        <div class="video-box">
          <video id="display-video" autoplay playsinline muted></video>
          <canvas id="display-canvas"></canvas>
        </div>
        <p id="stream-status" style="font-size:0.85rem; color:gray; margin-top:6px;">等待手機端連線開鏡頭串流...</p>
      </div>

      <div>
        <div class="card">
          <h3>跨裝置配對</h3>
          <p style="margin:4px 0;">手機掃碼配對或輸入房間碼：<strong id="room-id-display" style="color:red;">產生中...</strong></p>
          <div id="qrcode" style="display:flex; justify-content:center; margin:10px 0;"></div>
        </div>

        <div class="card" style="margin-top:15px;">
          <h3>② 五感解密 (NFC 實體觸控)</h3>
          <div id="vocab-box">請用手機感應 NFC 教具，在此顯示詞彙與挑戰...</div>
          <div id="challenge-box" style="margin-top:10px; font-weight:bold; color:#d32f2f;"></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:15px;">
      <h3>③ 潤飾重構 (學生改寫成果)</h3>
      <div id="student-rewrite-display" style="font-size:1.05rem; color:#2c3e50;">等待學生提交...</div>
    </div>
  </div>

  <!-- ==================== 感應端 (Mobile) ==================== -->
  <div id="mobile-panel" class="hidden">
    <div class="card">
      <h3>配對大螢幕</h3>
      <input type="text" id="input-room-id" placeholder="輸入號碼 (例如：ROOM-XXXX)" style="padding:8px; width:50%; font-size:1rem;">
      <button class="btn btn-success" onclick="connectToDisplay()">連線</button>
      <span id="conn-status" style="margin-left:8px; color:gray;">未連線</span>
    </div>

    <div class="card" style="margin-top:15px;">
      <h3>① 實時俯拍鏡頭</h3>
      <div class="video-box">
        <video id="mobile-video" autoplay playsinline muted></video>
      </div>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn" style="flex:1;" onclick="startMobileCamera()">📷 開啟鏡頭並同步串流</button>
        <button class="btn btn-success" style="flex:1;" onclick="captureAndAnalyze()">📸 拍照並分析結構</button>
      </div>
    </div>

    <div class="card" style="margin-top:15px;">
      <h3>② 五感解密 (WebNFC 實體觸控)</h3>
      <button class="btn btn-success" style="width:100%; padding:10px;" onclick="startNfcScan()">📡 開啟 NFC 讀取器</button>
      <p id="nfc-result" style="margin-top:8px; color:#2e7d32; font-weight:bold; font-size:0.9rem;">NFC 狀態：未啟動</p>
      
      <div style="margin-top:8px; border-top:1px dashed #ccc; padding-top:6px; font-size:0.8rem; color:#666;">
        測試卡片：
        <button class="btn btn-secondary" style="padding:3px 6px; font-size:0.75rem;" onclick="sendNfcData('NFC_SENSE_01')">視覺卡</button>
        <button class="btn btn-secondary" style="padding:3px 6px; font-size:0.75rem;" onclick="sendNfcData('NFC_RHETORIC_01')">轉化卡</button>
      </div>
    </div>

    <div class="card" style="margin-top:15px;">
      <h3>③ 潤飾重構 (學生改寫段落)</h3>
      <textarea id="rewrite-input" rows="3" style="width:100%; box-sizing:border-box; padding:8px;" placeholder="在此輸入改寫段落..."></textarea>
      <button class="btn" style="width:100%; margin-top:8px;" onclick="submitRewrite()">送出段落至大螢幕</button>
    </div>
  </div>
</div>

<script>
  // 💡 請在此處填入您部署的 GAS API 網址 (https://script.google.com/macros/s/.../exec)
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzubn87dxxTPEA-zbZKLNe1uY7Yg6IbW3V1JoPBjKV31gAzSYjzopxxhXTCvsW1TrTv/exec";
  
  let peer = null, dataConn = null, mediaStream = null;
  let roomId = "ROOM-" + Math.floor(1000 + Math.random() * 9000);

  const nfcDataMap = {
    "NFC_SENSE_01": {
      title: "【五感細節卡：視覺摹寫】",
      vocabs: ["微光斑駁", "影影綽綽", "璀璨耀眼", "驟然暗淡"],
      challenge: "挑戰：請在改寫段落中加入『微光斑駁』或『影影綽綽』！"
    },
    "NFC_RHETORIC_01": {
      title: "【修辭手法卡：轉化 / 擬人】",
      vocabs: ["微風吟唱", "歲月偷走", "孤獨對話", "情緒奔跑"],
      challenge: "挑戰：請賦予無生命的物件情緒，寫出一句擬人句！"
    }
  };

  function initDisplayMode() {
    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('display-panel').classList.remove('hidden');
    document.getElementById('room-id-display').innerText = roomId;

    // 前端為獨立網域，window.location.href 乾淨無沙盒
    const targetPairUrl = window.location.href.split('?')[0] + "?room=" + roomId;
    new QRCode(document.getElementById("qrcode"), {
      text: targetPairUrl,
      width: 130, height: 130
    });

    peer = new Peer(roomId);

    peer.on('connection', (c) => {
      dataConn = c;
      dataConn.on('data', handleIncomingData);
      alert('📱 手機端已成功連線！');
    });

    peer.on('call', (call) => {
      call.answer();
      call.on('stream', (remoteStream) => {
        const displayVid = document.getElementById('display-video');
        displayVid.srcObject = remoteStream;
        document.getElementById('stream-status').innerText = '✅ 正同步接收手機實時預覽畫面';
      });
    });
  }

  function handleIncomingData(data) {
    if (data.type === 'ANALYSIS_RESULT') {
      drawAnnotationsOnCanvas(data.analysis);
      playAudio('tag');
    }
    if (data.type === 'NFC_TRIGGER') {
      const nfcObj = nfcDataMap[data.payload] || {
        title: "自訂教具卡：" + data.payload,
        vocabs: ["豐富詞彙", "靈活運用"],
        challenge: "挑戰：請融入寫作中！"
      };
      let html = `<h4 style="margin:5px 0; color:#0288d1;">${nfcObj.title}</h4><div>`;
      nfcObj.vocabs.forEach(v => { html += `<span class="vocab-tag">${v}</span>`; });
      html += `</div>`;
      document.getElementById('vocab-box').innerHTML = html;
      document.getElementById('challenge-box').innerText = nfcObj.challenge;
      playAudio('nfc');
    }
    if (data.type === 'REWRITE_SUBMIT') {
      document.getElementById('student-rewrite-display').innerHTML = `
        <p><strong>改寫內容：</strong>${data.text}</p>
        <p style="color:#2e7d32;"><strong>系統檢測：</strong>成功運用感應細節與修辭手法！</p>
      `;
      playAudio('success');
    }
  }

  function drawAnnotationsOnCanvas(analysis) {
    const video = document.getElementById('display-video');
    const canvas = document.getElementById('display-canvas');
    const ctx = canvas.getContext('2d');

    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    analysis.paragraphs.forEach(p => {
      const rx = p.rect.x * canvas.width;
      const ry = p.rect.y * canvas.height;
      const rw = p.rect.width * canvas.width;
      const rh = p.rect.height * canvas.height;

      ctx.fillStyle = p.color;
      ctx.fillRect(rx, ry, rw, rh);

      ctx.strokeStyle = p.borderColor;
      ctx.lineWidth = 3;
      ctx.strokeRect(rx, ry, rw, rh);

      const fontSize = Math.max(14, canvas.width * 0.022);
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.fillStyle = p.borderColor;
      ctx.fillRect(rx, ry - fontSize - 6, ctx.measureText(p.label).width + 12, fontSize + 8);
      ctx.fillStyle = "#fff";
      ctx.fillText(p.label, rx + 6, ry - 6);
    });
  }

  function playAudio(type) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'nfc') {
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
    } else {
      osc.frequency.setValueAtTime(587.33, ctx.currentTime);
      osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
    }
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  }

  function initMobileMode() {
    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('mobile-panel').classList.remove('hidden');

    const urlParams = new URLSearchParams(window.location.search);
    const urlRoom = urlParams.get('room');
    if (urlRoom) {
      document.getElementById('input-room-id').value = urlRoom;
      connectToDisplay();
    }
  }

  function connectToDisplay() {
    const targetRoom = document.getElementById('input-room-id').value;
    if (!targetRoom) return alert('請輸入房間碼');

    peer = new Peer();
    peer.on('open', () => {
      dataConn = peer.connect(targetRoom);
      dataConn.on('open', () => {
        document.getElementById('conn-status').innerText = '✅ 已連線大螢幕';
        document.getElementById('conn-status').style.color = 'green';
      });
    });
  }

  // 1. 開啟相機（獨立網域下可直接請求權限，無沙盒阻擋）
  async function startMobileCamera() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment" }, audio: false
      });
      document.getElementById('mobile-video').srcObject = mediaStream;

      const targetRoom = document.getElementById('input-room-id').value;
      if (peer && targetRoom) {
        peer.call(targetRoom, mediaStream);
      }
    } catch (err) {
      alert("相機存取失敗: " + err.message + "\n請確認使用 Chrome/Safari 瀏覽器並允許權限。");
    }
  }

  // 2. 拍照並透過 fetch 送給 GAS API 分析
  function captureAndAnalyze() {
    const video = document.getElementById('mobile-video');
    if (!video.videoWidth) return alert('請先開啟鏡頭！');

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    const base64Img = canvas.toDataURL('image/jpeg');

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "analyzeImage", base64Image: base64Img })
    })
    .then(res => res.json())
    .then(response => {
      if (response.status === 'success' && dataConn && dataConn.open) {
        dataConn.send({
          type: 'ANALYSIS_RESULT',
          analysis: response.data
        });
        alert('畫面已成功擷取分析並疊加至大螢幕！');
      }
    })
    .catch(err => alert("API 呼叫失敗: " + err));
  }

  // 3. 原生 WebNFC 讀取器 (原生獨立網域支援)
  async function startNfcScan() {
    const nfcStatus = document.getElementById('nfc-result');
    if ('NDEFReader' in window) {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        nfcStatus.innerText = "NFC 狀態：讀取器運作中，請靠近教具...";

        ndef.addEventListener("reading", ({ message }) => {
          for (const record of message.records) {
            const textDecoder = new TextDecoder(record.encoding);
            sendNfcData(textDecoder.decode(record.data));
          }
        });
      } catch (error) {
        nfcStatus.innerText = "NFC 失敗：" + error.message;
      }
    } else {
      nfcStatus.innerText = "瀏覽器不支援 WebNFC (可用測試按鈕)";
    }
  }

  function sendNfcData(payload) {
    document.getElementById('nfc-result').innerText = `已感應教具：${payload}`;
    if (dataConn && dataConn.open) {
      dataConn.send({ type: 'NFC_TRIGGER', payload: payload });
    } else {
      alert('請先連線大螢幕！');
    }
  }

  function submitRewrite() {
    const text = document.getElementById('rewrite-input').value;
    if (!text) return alert('請輸入內容');
    
    // 傳送給大螢幕
    if (dataConn && dataConn.open) {
      dataConn.send({ type: 'REWRITE_SUBMIT', text: text });
    }

    // 備份紀錄至 GAS 試算表
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "saveRecord",
        data: { roomId: document.getElementById('input-room-id').value, rewrittenText: text }
      })
    });

    alert('已送出改寫段落！');
  }
</script>
</body>
</html>
